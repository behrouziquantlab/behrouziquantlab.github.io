   Order: 1) language the visitor chose before (localStorage bql_lang)  2) this session's detection (sessionStorage)
          3) country from IP via a free geolocation service (country code only is read; nothing is stored or sent elsewhere)
          4) browser language  5) English.   Test hook: ?cc=DE simulates a country without any network call. */
(function () {
  var LANGS = ['en', 'fa', 'de', 'fr', 'es', 'pt', 'tr', 'zh-cn'];
  var C = { fa: 'IR AF TJ', de: 'DE AT CH LI', fr: 'FR BE MC LU SN CI CM ML BF NE TG BJ GA CG CD MG HT GN TD CF DJ KM RW BI NC PF RE GP MQ GF YT PM WF MA DZ TN',
            es: 'ES MX AR CO CL PE VE EC GT CU BO DO HN PY SV NI CR PA UY PR GQ', pt: 'PT BR AO MZ CV GW ST TL', tr: 'TR', 'zh-cn': 'CN' };
  var MAP = {}; for (var l in C) C[l].split(' ').forEach(function (c) { MAP[c] = l; });
  function ok(l) { return LANGS.indexOf(l) >= 0; }
  function go(l, why) { try { sessionStorage.setItem('bql_auto', l); } catch (e) {} document.documentElement.setAttribute('data-why', why); location.replace(l + '/index.html'); }
  function browser() { var b = (navigator.languages && navigator.languages[0]) || navigator.language || 'en'; b = b.toLowerCase(); if (b.indexOf('zh') === 0) return 'zh-cn'; b = b.slice(0, 2); return ok(b) ? b : 'en'; }
  var saved = null; try { saved = localStorage.getItem('bql_lang') || sessionStorage.getItem('bql_auto'); } catch (e) {}
  var q = /[?&]cc=([A-Za-z]{2})/.exec(location.search);
  if (q) return go(MAP[q[1].toUpperCase()] || browser(), 'test-country');
  if (saved && ok(saved)) return go(saved, 'saved');
  function geo(url, pick, next) {
    var done = false, t = setTimeout(function () { if (!done) { done = true; next(); } }, 1500);
    fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }).then(function (r) { return r.json(); }).then(function (j) {
      if (done) return; done = true; clearTimeout(t); var cc = (pick(j) || '').toUpperCase(); if (MAP[cc]) go(MAP[cc], 'country'); else go(browser(), 'browser'); })
      .catch(function () { if (!done) { done = true; clearTimeout(t); next(); } });
  }
  if (!window.fetch) return go(browser(), 'browser');
  geo('https://api.country.is/', function (j) { return j.country; }, function () {
    geo('https://get.geojs.io/v1/ip/country.json', function (j) { return j.country; }, function () { go(browser(), 'browser'); });
  });
})();
